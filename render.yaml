# =============================================================================
# TripLedger — Render Blueprint (render.yaml)
# Two-service deployment: Express API Web Service + React PWA Static Site
# NEVER store real secrets, passwords, or connection strings in this file.
# =============================================================================
services:
  # 1. Backend API Web Service (@tripledger/server)
  - type: web
    name: tripledger-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm --workspace=@tripledger/server run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_STORE
        value: mongo
      - key: DEPLOYMENT_TOPOLOGY
        value: single-instance
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: EMAIL_PROVIDER
        value: WEBHOOK
      - key: EMAIL_FROM
        value: TripLedger <onboarding@resend.dev>
      - key: EMAIL_WEBHOOK_URL
        value: https://api.resend.com/emails
      - key: EMAIL_WEBHOOK_API_KEY
        sync: false

  # 2. Frontend React PWA Static Site (@tripledger/client)
  - type: web
    name: tripledger-web
    runtime: static
    buildCommand: npm ci && npm run build:shared && npm run build:client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tripledger-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: VITE_APP_NAME
        value: TripLedger
      - key: VITE_DEFAULT_CURRENCY
        value: NPR
